# notesview / Neovim shared config.
# install.sh links this file to ~/.config/notesview/config.toml. Both notesview
# and the Neovim config read it and pick up changes automatically.

# Classes. Each one gets a folder at <notes>/classes/<folder>/ holding one
# lecture note per day (<Space>nc) and an index.md. Any task in that folder,
# or tagged #<id> anywhere else (inbox, daily notes, …), counts as homework.
#
# To add a class, copy a block and change the three values:
#
#   [[class]]
#   id     = "math101"       # short tag, used as #math101
#   name   = "MATH 101"      # display name
#   folder = "math101"       # folder under classes/

[[class]]
id     = "act200"
name   = "ACT 200"
folder = "act200"

[[class]]
id     = "psyc110"
name   = "PSYC 110"
folder = "psyc110"

[[class]]
id     = "bus300"
name   = "BUS 300"
folder = "bus300"
