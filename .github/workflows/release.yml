name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: renderer/go.mod
      - name: Test
        working-directory: renderer
        run: go vet ./... && go test ./...
      - name: Tag matches notesview version
        working-directory: renderer
        run: |
          v="$(go run . --version | awk '{print $2}')"
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME does not match version $v in main.go"; exit 1; }
      - name: Build binaries
        working-directory: renderer
        env:
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          for target in darwin-arm64 darwin-amd64 linux-amd64 linux-arm64; do
            GOOS="${target%-*}" GOARCH="${target#*-}" go build -trimpath -ldflags "-s -w" -o "dist/notesview-$target" .
          done
          (cd dist && sha256sum notesview-* > SHA256SUMS)
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: renderer/dist/*
