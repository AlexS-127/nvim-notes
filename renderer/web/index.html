<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>notesview</title>
<link rel="icon" href="data:,">
<script src="/theme.js"></script>
<script>
  // Before first paint: the palette and appearance from config.json (default: follow the system, like
  // Ghostty and Neovim); the saved sidebar state.
  (function () {
    var get = function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } };
    var t = window.__notesviewTheme || {};
    if (t.palette) document.documentElement.dataset.palette = t.palette;
    if (t.font) ["body", "heading", "ui"].forEach(function (k) { document.documentElement.style.setProperty("--font-" + k, t.font); });
    document.documentElement.dataset.theme = t.mode || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    if (get("sidebar") === "collapsed") document.documentElement.classList.add("sidebar-collapsed-pending");
  })();
</script>
<link rel="stylesheet" href="/katex/katex.min.css">
<link rel="stylesheet" href="/app.css">
<link rel="stylesheet" href="/themes.css">
<link rel="stylesheet" href="/chroma.css">
<link rel="stylesheet" href="/custom.css" id="custom-css">
</head>
<body>
<script>if (document.documentElement.classList.contains("sidebar-collapsed-pending")) document.body.classList.add("sidebar-collapsed");</script>
<button id="btn-expand" class="icon-btn" title="Show sidebar (b)" aria-label="Show sidebar">»</button>
<aside id="sidebar">
  <div class="side-head">
    <div class="side-top">
      <input id="search" type="search" placeholder="Search notes  ( / )" autocomplete="off" spellcheck="false">
      <button id="btn-collapse" class="icon-btn" title="Hide sidebar (b)" aria-label="Hide sidebar">«</button>
    </div>
    <div class="side-actions">
      <button id="btn-tasks" title="Open tasks (t)">Tasks</button>
      <button id="btn-activity" title="Activity: streaks, calendar, weekly chart (a)">Activity</button>
      <button id="btn-classes" title="Classes: import a schedule, attendance (c)">Classes</button>
      <button id="btn-reading" title="Reading list: books, pages read (r)">Reading</button>
      <button id="btn-today" title="Today's note (g)">Today</button>
    </div>
  </div>
  <nav id="tree"></nav>
</aside>
<main id="main">
  <article id="note" class="note"></article>
  <section id="backlinks" class="backlinks" hidden></section>
</main>
<script src="/katex/katex.min.js"></script>
<script src="/calendar.js"></script>
<script src="/reading.js"></script>
<script src="/app.js"></script>
</body>
</html>
